[project]
name = "papertrail"
version = "0.1.0"
description = "A small, complete document approval workflow"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django==5.2.18",
  "djangorestframework==3.18.3",
  "dj-database-url==3.1.2",
  "psycopg[binary]==3.3.6",
  "vercel==0.11.6",
  "python-dotenv==1.2.4",
  "whitenoise==6.12.0",
  "pypdf==6.19.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-django>=4.11,<5", "reportlab>=4,<5", "python-docx>=1,<2"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["workflow/tests"]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python scripts/build.py"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "F403", "F405"]
